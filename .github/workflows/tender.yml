# 放到 repo 的 .github/workflows/tender.yml
# 功能: 每天台灣時間 08:30 / 13:30 / 17:30 在 GitHub 雲端執行爬蟲，
#       把更新後的 dashboard.html 和 tenders.json commit 回 repo。
#       Cloudflare Pages 綁定這個 repo 後，每次 commit 會自動重新部署。

name: tender-watch

on:
  schedule:
    # GitHub 用 UTC 時間，台灣 = UTC+8
    - cron: "30 0 * * *"   # 台灣 08:30
    - cron: "30 5 * * *"   # 台灣 13:30
    - cron: "30 9 * * *"   # 台灣 17:30
  workflow_dispatch: {}     # 也可以在 GitHub 網頁上手動按執行

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install requests beautifulsoup4 lxml

      - name: 執行爬蟲
        run: python tender_watch.py

      - name: 上傳除錯頁面(給開發者看的)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-pages
          path: debug/
          if-no-files-found: ignore

      - name: Commit 更新後的儀表板
        run: |
          git config user.name "tender-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dashboard.html tenders.json
          git diff --cached --quiet || git commit -m "update $(date '+%Y-%m-%d %H:%M')"
          git push
